name: Smoke-test guarded Guide Studio (no deployment)
on:
  push:
    branches: [fix/guard-admin-startup]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and browser runner
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core
      - name: Build with existing Supabase settings
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Launch Vite preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/atreia-preview.log 2>&1 &
          sleep 3
      - name: Smoke-test home and admin in headless Chrome
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          node scripts/guarded-smoke.mjs
