name: Atreia Street Companion · Windows Preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/companion/**'
      - 'supabase/migrations/20261108_companion_telemetry.sql'
      - '.github/workflows/companion-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project capture/AtreiaCapture.csproj -- --self-test
      - name: Install dependencies (retry transient download errors)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm install
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Electron dependency download failed (attempt $attempt of 3)."
            Start-Sleep -Seconds (5 * $attempt)
          }
          exit 1
      - run: npm test
      - name: Reject OCR dependency versions unsupported by packaged Electron
        run: npm run verify:ocr-dependencies
      - run: node --check main.cjs
      - run: node --check ui.js
      - run: node --check overlay.js
      - run: node --check overlay-preload.cjs
      - run: node --check discovery.cjs
      - run: node --check wallets.js
      - run: node --check item-catalog.js
      - run: node --check item-economy.js
      - run: node --check market-ocr.cjs
      - run: node --check market-fees.cjs
      - run: node --check market-spatial.cjs
      - run: node --check market-frame-buffer.cjs
      - run: node --check market-capture-health.cjs
      - run: node --check market-live-frame.cjs
      - run: node --check market-live-capture.cjs
      - run: node --check market-stream-preload.cjs
      - run: node --check market-stream-renderer.js
      - run: npm run capture:build
      - name: Package Windows preview (retry transient CDN errors)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Windows preview package download failed (attempt $attempt of 3)."
            Start-Sleep -Seconds (5 * $attempt)
          }
          exit 1
      - name: Launch packaged Electron and initialize OCR worker
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'release/win-unpacked/Atreia Street Companion.exe'
          if (-not (Test-Path $exe)) { throw "Packaged companion executable not found: $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--atreia-startup-smoke' -PassThru
          if (-not $p.WaitForExit(105000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged companion OCR smoke timed out'
          }
          $p.Refresh()
          if ($p.ExitCode -ne 0) { throw "Packaged companion OCR smoke failed with exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: atreiastreet-companion-windows-preview
          path: desktop/companion/release/*.exe
          if-no-files-found: error
