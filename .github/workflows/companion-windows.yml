name: Atreia Street Companion · Windows MVP
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/companion/**'
      - 'supabase/migrations/20261108_companion_telemetry.sql'
      - '.github/workflows/companion-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: atreiastreet-companion-windows-preview
          path: desktop/companion/release/*.exe
          if-no-files-found: error
