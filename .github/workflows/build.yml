name: Build, package and (when configured) deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Also allow Supabase public credentials saved as production environment secrets.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required website artwork
        run: |
          test -s public/assets/branding/aion-logo.avif
          test -s public/assets/hero/aion-hero-purple.avif
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression test player profile initialization
        run: node tests/player-profile-race.mjs
      - name: Verify Supabase Guide Studio configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -n "$VITE_SUPABASE_URL" && -n "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "Guide Studio configuration: both Supabase values are present."
            node -e 'try { const u = new URL(process.env.VITE_SUPABASE_URL); if (u.protocol !== "https:" || !u.hostname || u.username || u.password || u.pathname !== "/" || u.search || u.hash) throw new Error("Invalid origin"); console.log("Supabase Project URL format is valid."); } catch { console.error("::error::Invalid Supabase Project URL. It must be an HTTPS origin, such as https://your-project.supabase.co"); process.exit(1); }'
          elif [[ -z "$VITE_SUPABASE_URL" && -z "$VITE_SUPABASE_ANON_KEY" ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "::error::Production deployment requires both Supabase credentials; refusing to ship disabled Guide Studio."
              exit 1
            fi
            echo "::warning::Guide Studio preview is in setup mode: add both VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY."
          else
            echo "::error::Guide Studio configuration is incomplete: both Supabase values are required."
            exit 1
          fi
      - name: Verify Supabase API key against the project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const url = new URL('/auth/v1/settings', process.env.VITE_SUPABASE_URL);
          try {
            const response = await fetch(url, {
              headers: { apikey: process.env.VITE_SUPABASE_ANON_KEY },
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) {
              console.error('::error::Supabase rejected the configured API key (HTTP ' + response.status + '). Confirm that the publishable/anon key and Project URL belong to the same Supabase project.');
              process.exitCode = 1;
            } else {
              console.log('Supabase accepted the configured API key (HTTP ' + response.status + ').');
            }
          } catch (error) {
            console.error('::error::Could not verify Supabase API access: ' + error.message);
            process.exitCode = 1;
          }
          NODE
      - name: Typecheck and build
        env:
          # Public browser credentials (never use Supabase service_role).
          # Until these are configured, the site remains in setup mode.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Package ready-to-upload website
        uses: actions/upload-artifact@v4
        with:
          name: aion2-website-files
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to hosting.com (FTPS)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
    steps:
      - name: Check deployment settings
        id: configured
        shell: bash
        run: |
          if [[ -n "$FTP_HOST" && -n "$FTP_USER" && -n "$FTP_PASSWORD" && -n "$FTP_REMOTE_DIR" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'FTPS not configured yet: add FTP_HOST, FTP_USER, FTP_PASSWORD and FTP_REMOTE_DIR to repository secrets.'
          fi
      - name: Download site build
        if: steps.configured.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: aion2-website-files
          path: ./dist
      - name: Normalize FTPS destination folder
        id: destination
        if: steps.configured.outputs.ready == 'true'
        shell: bash
        run: |
          folder="${FTP_REMOTE_DIR%/}/"
          if [[ "$folder" == "/" ]]; then
            echo 'Using FTP account root as destination'
          fi
          echo "server_dir=$folder" >> "$GITHUB_OUTPUT"
      - name: Upload compiled website (not source) via encrypted FTPS
        if: steps.configured.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ steps.destination.outputs.server_dir }}
          log-level: standard
