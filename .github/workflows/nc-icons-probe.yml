name: Verify NCSOFT item dictionary and icon mappings
on:
  pull_request:
    paths: ['scripts/probe-nc-icons.mjs', '.github/workflows/nc-icons-probe.yml', 'scripts/sync-nc-icons.mjs']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/probe-nc-icons.mjs
